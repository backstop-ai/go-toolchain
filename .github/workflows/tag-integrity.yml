# Temporary hand-written gate (ISSUE-084 / DIR-027 thread 5). Successor: the
# BUNDLE-015 REQ-018 CI recipe pack + full backstop pack check/test once a
# fetchable backstop release exists (DIR-001).
#
# Deliberately carries NO backstop dependency: there is no public backstop
# release binary yet, so CI cannot run `backstop pack check` / `backstop pack
# test`. This ships only the half that needs no backstop — pack identity and
# tag/version agreement.

name: tag-integrity

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  tag-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed ref
        uses: actions/checkout@v4

      - name: Install a YAML parser
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Assert pack.yml parses and declares a semantic version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, yaml

          try:
              manifest = yaml.safe_load(open("pack.yml"))
          except yaml.YAMLError as exc:
              sys.exit(f"::error file=pack.yml::pack.yml is not valid YAML: {exc}")

          if not isinstance(manifest, dict):
              sys.exit("::error file=pack.yml::pack.yml did not parse to a mapping")

          version = str(manifest.get("version"))
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(
                  f"::error file=pack.yml::VERSION MALFORMED - pack.yml declares "
                  f"version {version!r}, which is not an X.Y.Z semantic version."
              )

          print(f"pack.yml parses as YAML; version {version} is well-formed")
          PY

      - name: Assert the tag matches the declared pack version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, yaml

          tag = os.environ["PUSHED_TAG"]
          expected = tag[1:]
          declared = str(yaml.safe_load(open("pack.yml")).get("version"))

          if declared != expected:
              sys.exit(
                  f"::error file=pack.yml::TAG/VERSION MISMATCH - tag {tag} implies "
                  f"pack version {expected}, but pack.yml at this ref declares "
                  f"{declared}. Retag, or bump pack.yml so the two agree."
              )

          print(f"tag {tag} matches the pack.yml version {declared}")
          PY
